[package]
name = "cliprtc-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = [
  "v4",
  "serde"
] }
sha2 = "0.10"
hkdf = "0.12"
rcgen = "0.14.5"
ed25519-dalek = { version = "2", features = [ "pkcs8" ] }
rustls-pki-types = "1"
x509-parser = "0.16"
tokio = { version = "1", features = [
  "sync",
  "time",
  "rt",
  "macros"
] }
tokio-util = "0.7"
bytes = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = [ "full" ] }
